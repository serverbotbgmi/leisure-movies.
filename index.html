<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>LeisureMax - Watch Movies & Series</title>
  <meta name="theme-color" content="#0a0a0c" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #141419;
      --accent: #e50914;
      --accent-glow: rgba(229, 9, 20, 0.35);
      --gold: #f59e0b;
      --text-muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: #ffffff;
      padding-bottom: 90px;
      overflow-x: hidden;
      user-select: none;
    }

    /* Vivamax Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: linear-gradient(180deg, rgba(9,9,11,0.95) 0%, rgba(9,9,11,0.6) 70%, transparent 100%);
      backdrop-filter: blur(8px);
      z-index: 90;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
    }
    .brand span {
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .vip-pill {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #000;
      font-weight: 800;
      font-size: 11px;
      padding: 5px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
      cursor: pointer;
    }

    /* Video Player Container */
    #player-wrap {
      display: none;
      position: sticky;
      top: 0;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    }
    #video-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Featured Vivamax Billboard */
    .billboard {
      position: relative;
      width: 100%;
      height: 480px;
      background: linear-gradient(180deg, rgba(9,9,11,0.1) 0%, rgba(9,9,11,0.6) 65%, var(--bg) 100%),
                  url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80') center/cover;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px 16px;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .badge-tag {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge-tag.rating {
      background: var(--accent);
      color: #fff;
    }

    .billboard-title {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .billboard-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn-main {
      flex: 1;
      background: #fff;
      color: #000;
      font-weight: 700;
      padding: 12px;
      border-radius: 8px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-secondary {
      flex: 1;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-weight: 700;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    /* Carousel Sections */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 16px 10px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .see-all {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 4px 16px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .carousel::-webkit-scrollbar {
      display: none;
    }

    /* Movie Cards */
    .movie-card {
      flex: 0 0 135px;
      scroll-snap-align: start;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-bg);
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .poster-box {
      width: 100%;
      height: 195px;
      position: relative;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .poster-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-free {
      background: #10b981;
      color: #000;
    }
    .badge-vip {
      background: linear-gradient(135deg, #e50914, #ff334b);
      color: #fff;
      box-shadow: 0 2px 6px rgba(229, 9, 20, 0.4);
    }

    .movie-meta {
      padding: 8px 10px 12px;
    }

    .movie-name {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .movie-genre {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Paywall Modal */
    #paywall-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .paywall-card {
      background: linear-gradient(180deg, #181920 0%, #101015 100%);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      width: 100%;
      max-width: 330px;
      border: 1px solid rgba(229, 9, 20, 0.4);
      box-shadow: 0 8px 32px rgba(229, 9, 20, 0.2);
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .vip-icon-banner {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, #e50914, #b91c1c);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .paywall-card h3 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #fff;
    }

    .paywall-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .price-tag {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 16px;
    }
    .price-tag span {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: normal;
    }

    .btn-pay-action {
      display: block;
      background: linear-gradient(135deg, #e50914, #ff2d3b);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 16px var(--accent-glow);
      margin-bottom: 12px;
    }

    .btn-cancel {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Fixed Bottom App Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(9, 9, 11, 0.94);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 95;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-decoration: none;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-icon {
      font-size: 18px;
    }
  </style>
</head>
